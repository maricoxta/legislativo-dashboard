name: Classificação temática

# Todo dia às 7h (Brasília), depois do job de situação: treina o modelo com
# os temas oficiais da Câmara, avalia e grava os temas dos PLs no Supabase.
# Também pode ser disparado à mão na aba Actions.
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  classificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: jobs/requirements.txt
      - run: pip install -r jobs/requirements.txt
      - name: Classificar PLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python jobs/classificacao_tematica.py
